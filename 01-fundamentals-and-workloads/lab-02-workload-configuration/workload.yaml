apiVersion: v1
kind: ConfigMap
metadata:
  name: web-readiness
data:
  status: ready
---
apiVersion: v1
kind: Secret
metadata:
  name: web-demo
type: Opaque
stringData:
  # Valor fictício para fins didáticos. Nunca versionar credenciais reais.
  demo-token: fictional-lab-token
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workload-config-web
  template:
    metadata:
      labels:
        app: workload-config-web
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:1.28-alpine@sha256:7377697a821c131a924a7105fafbe7414db4e9fcc77a6f08f776f33f141ec3f8
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DEMO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: web-demo
                  key: demo-token
          volumeMounts:
            - name: writable-tmp
              mountPath: /tmp
            - name: readiness
              mountPath: /etc/lab-readiness
              readOnly: true
          readinessProbe:
            exec:
              command: [grep, -qx, ready, /etc/lab-readiness/status]
            periodSeconds: 3
            failureThreshold: 2
      volumes:
        - name: writable-tmp
          emptyDir: {}
        - name: readiness
          configMap:
            name: web-readiness
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    app: workload-config-web
  ports:
    - name: http
      port: 80
      targetPort: http
